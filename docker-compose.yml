services:
  # ============================================================================
  # KAFKA (Message Broker) - KRaft mode (no ZooKeeper needed)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: smart-noc-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft configuration (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Resource limits for laptop
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
          localhost:9092",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-noc-network

  # ============================================================================
  # KAFKA UI (Web interface for Kafka)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smart-noc-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-noc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smart-noc-network

  # ============================================================================
  # LOGSTASH (Log Parser)
  # ============================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: smart-noc-logstash
    ports:
      - "5000:5000/tcp"  # TCP syslog input
      - "5000:5000/udp"  # UDP syslog input (Extreme Networks switches)
      - "9600:9600"      # Monitoring API
    environment:
      LS_JAVA_OPTS: "-Xmx2048m -Xms1024m"
      MONITORING_ENABLED: "false"
    volumes:
      - ./infrastructure/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./infrastructure/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infrastructure/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      device-enrichment:
        condition: service_healthy
    networks:
      - smart-noc-network

  # ============================================================================
  # ELASTICSEARCH (Log Storage)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: smart-noc-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-noc-network

  # ============================================================================
  # GRAFANA (Dashboard)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: smart-noc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smart-noc-network

  # ============================================================================
  # REDIS (State Management for Anomaly Detection)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: smart-noc-redis
    ports:
      - "6380:6379" # Changed to 6380 to avoid conflict
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smart-noc-network

  # ============================================================================
  # POSTGRESQL (Incident Storage)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: smart-noc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smart_noc
      POSTGRES_USER: noc_admin
      POSTGRES_PASSWORD: noc_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc_admin -d smart_noc"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smart-noc-network

  # ============================================================================
  # DEVICE ENRICHMENT SERVICE (HTTP API for Device Metadata)
  # ============================================================================
  device-enrichment:
    build:
      context: ./services/device-enrichment
      dockerfile: Dockerfile
    container_name: smart-noc-device-enrichment
    ports:
      - "8081:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_noc
      POSTGRES_USER: noc_admin
      POSTGRES_PASSWORD: noc_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL: 3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smart-noc-network

  # ============================================================================
  # ANOMALY DETECTOR (AI-Powered Detection Service)
  # ============================================================================
  anomaly-detector:
    build:
      context: ./services/anomaly-detector
      dockerfile: Dockerfile
    container_name: smart-noc-anomaly-detector
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./services/anomaly-detector:/app:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smart-noc-network

  # ============================================================================
  # CORRELATION ENGINE (Incident Detection Service)
  # ============================================================================
  correlation-engine:
    build:
      context: ./services/correlation-engine
      dockerfile: Dockerfile
    container_name: smart-noc-correlation-engine
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./services/correlation-engine:/app:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smart-noc-network

  # ============================================================================
  # LLM DIAGNOSIS SERVICE (Phase 4: AI-Powered Root Cause Analysis)
  # ============================================================================
  llm-diagnosis:
    build:
      context: ./services/llm-diagnosis
      dockerfile: Dockerfile
    container_name: smart-noc-llm-diagnosis
    environment:
      PYTHONUNBUFFERED: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_INPUT_TOPIC: incidents
      KAFKA_OUTPUT_TOPIC: incidents-diagnosed
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-llm-diagnosis-service}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_noc
      POSTGRES_USER: noc_admin
      POSTGRES_PASSWORD: noc_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DIAGNOSIS_MIN_CONFIDENCE: ${DIAGNOSIS_MIN_CONFIDENCE:-0.3}
      DIAGNOSIS_DELAY_SECONDS: ${DIAGNOSIS_DELAY_SECONDS:-5}
      ENABLE_DIAGNOSIS: ${ENABLE_DIAGNOSIS:-true}
      ENABLE_REMEDIATION: ${ENABLE_REMEDIATION:-true}
      ENABLE_COST_TRACKING: ${ENABLE_COST_TRACKING:-true}
      # Week 2: Vector Service Integration
      VECTOR_SERVICE_ENABLED: ${VECTOR_SERVICE_ENABLED:-true}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      VECTOR_SIMILAR_INCIDENTS_COUNT: ${VECTOR_SIMILAR_INCIDENTS_COUNT:-3}
      VECTOR_KB_ARTICLES_COUNT: ${VECTOR_KB_ARTICLES_COUNT:-2}
      VECTOR_MIN_SIMILARITY: ${VECTOR_MIN_SIMILARITY:-0.60}
    volumes:
      - ./services/llm-diagnosis:/app:ro
      - ./services/vector-service:/vector_service:ro # Week 2: Mount vector service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      correlation-engine:
        condition: service_started
      chromadb:
        condition: service_started # Week 2: Depend on vector DB
    restart: unless-stopped
    networks:
      - smart-noc-network
    # Note: Service will not start without LLM_API_KEY set in .env file

  # ============================================================================
  # CHROMADB (Vector Database for Knowledge Base & Similarity Search)
  # ============================================================================
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: smart-noc-chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - smart-noc-network

  # ============================================================================
  # VECTOR SERVICE (Manages Vector DB & Embeddings)
  # ============================================================================
  vector-service:
    build:
      context: ./services/vector-service
      dockerfile: Dockerfile
    container_name: smart-noc-vector-service
    environment:
      PYTHONUNBUFFERED: "1"
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_noc
      POSTGRES_USER: noc_admin
      POSTGRES_PASSWORD: noc_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services/vector-service:/app:ro
    depends_on:
      - chromadb
      - postgres
    restart: unless-stopped
    networks:
      - smart-noc-network

  # ============================================================================
  # REMEDIATION AGENT (Autonomous Remediation with LangGraph)
  # ============================================================================
  remediation-agent:
    build:
      context: ./services/remediation-agent
      dockerfile: Dockerfile
    container_name: smart-noc-remediation-agent
    environment:
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${LLM_API_KEY} # Reuse same API key
      LLM_MODEL: "llama-3.3-70b-versatile"
      SIMULATION_MODE: ${REMEDIATION_SIMULATION_MODE:-true}
      ENABLE_AUTO_EXECUTION: ${ENABLE_AUTO_EXECUTION:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_CONSUME_TOPIC: incidents-diagnosed
      KAFKA_PRODUCE_TOPIC: incident-remediations
      KAFKA_GROUP_ID: remediation-agent-group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_noc
      POSTGRES_USER: noc_admin
      POSTGRES_PASSWORD: noc_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_RETRY_ATTEMPTS: 3
      REQUIRE_APPROVAL_ABOVE_SEVERITY: HIGH
      CHROMADB_HOST: chromadb  # Phase 2: ChromaDB for remediation lessons
      CHROMADB_PORT: 8000
    volumes:
      - ./services/remediation-agent:/app:ro
      - ./services/vector-service:/vector_service:ro  # Phase 2: Mount vector service for ChromaDB
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llm-diagnosis:
        condition: service_started
      chromadb:  # Phase 2: Wait for ChromaDB
        condition: service_started
    restart: unless-stopped
    networks:
      - smart-noc-network

    # ==============================================================================
    # NETWORKS
    # ==============================================================================
networks:
  smart-noc-network:
    driver: bridge
    name: smart-noc-network

# ==============================================================================
# VOLUMES (Persistent Storage)
# ==============================================================================
volumes:
  kafka-data:
    name: smart-noc-kafka-data
  elasticsearch-data:
    name: smart-noc-elasticsearch-data
  grafana-data:
    name: smart-noc-grafana-data
  redis-data:
    name: smart-noc-redis-data
  postgres-data:
    name: smart-noc-postgres-data
  chromadb-data:
    name: smart-noc-chromadb-data
