# Smart NOC - Logstash Pipeline: Incidents
# Purpose: Consume incidents from Kafka and index to Elasticsearch

input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["incidents"]
    group_id => "logstash-incidents"
    codec => json
    consumer_threads => 1
    decorate_events => true
  }
}

filter {
  # Parse timestamp
  if [created_at] {
    date {
      match => [ "created_at", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Add incident identifier
  mutate {
    add_field => { "[@metadata][index_prefix]" => "incidents" }
  }

  # Parse start_time
  if [start_time] {
    date {
      match => [ "start_time", "ISO8601" ]
      target => "incident_start"
    }
  }

  # Parse end_time if exists
  if [end_time] {
    date {
      match => [ "end_time", "ISO8601" ]
      target => "incident_end"
    }
  }

  # Convert numeric fields
  mutate {
    convert => {
      "incident_number" => "integer"
      "affected_device_count" => "integer"
      "anomaly_count" => "integer"
      "duration_seconds" => "integer"
      "correlation_confidence" => "float"
      "impact_score" => "float"
    }
  }

  # Add Elasticsearch document ID (use incident UUID)
  if [id] {
    mutate {
      add_field => { "[@metadata][_id]" => "%{id}" }
    }
  }

  # Calculate incident age
  ruby {
    code => "
      if event.get('incident_start')
        age_seconds = (Time.now - event.get('incident_start')).to_i
        event.set('age_seconds', age_seconds)
        event.set('age_minutes', (age_seconds / 60.0).round(2))
      end
    "
  }

  # Enrich with incident context
  mutate {
    add_field => {
      "document_type" => "incident"
      "indexed_at" => "%{@timestamp}"
    }
  }

  # Clean up Kafka metadata
  mutate {
    remove_field => [ "@version", "[@metadata][kafka]" ]
  }
}

output {
  # Index to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "incidents-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][_id]}"
    action => "index"
  }

  # Debug output (remove in production)
  # stdout {
  #   codec => rubydebug
  # }
}
