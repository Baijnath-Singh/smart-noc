# ==============================================================================
# Smart NOC - Syslog Input Pipeline
# ==============================================================================
# This pipeline:
# 1. Receives syslog messages via TCP on port 5000
# 2. Parses syslog format
# 3. Publishes to Kafka "network-logs" topic for downstream processing

input {
  # TCP input (for systems that support TCP syslog)
  tcp {
    port => 5000
    codec => plain
    type => "syslog"
  }
  
  # UDP input (standard syslog protocol - Extreme Networks switches use this)
  udp {
    port => 5000
    codec => plain
    type => "syslog"
  }
}

filter {
  # Parse syslog message
  grok {
    match => {
      "message" => [
        # RFC3164 format (traditional syslog)
        "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}",
        # RFC5424 format
        "<%{POSINT:syslog_pri}>%{NONNEGINT:syslog_version} %{TIMESTAMP_ISO8601:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{NOTSPACE:syslog_program} %{NOTSPACE:syslog_proc_id} %{NOTSPACE:syslog_msgid} %{GREEDYDATA:syslog_message}",
        # Extreme Networks format
        "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{GREEDYDATA:syslog_message}"
      ]
    }
    add_tag => [ "syslog_parsed" ]
  }

  # If grok parsing failed, keep original message
  if "_grokparsefailure" in [tags] {
    mutate {
      add_field => { "syslog_message" => "%{message}" }
      add_field => { "syslog_hostname" => "%{host}" }
      remove_tag => [ "_grokparsefailure" ]
    }
  }

  # Parse syslog priority into facility and severity
  if [syslog_pri] {
    ruby {
      code => "
        pri = event.get('syslog_pri').to_i
        facility = pri >> 3
        severity = pri & 7
        
        facility_names = {
          0 => 'kern', 1 => 'user', 2 => 'mail', 3 => 'daemon',
          4 => 'auth', 5 => 'syslog', 6 => 'lpr', 7 => 'news',
          16 => 'local0', 17 => 'local1', 18 => 'local2', 19 => 'local3',
          20 => 'local4', 21 => 'local5', 22 => 'local6', 23 => 'local7'
        }
        
        severity_names = {
          0 => 'emergency', 1 => 'alert', 2 => 'critical', 3 => 'error',
          4 => 'warning', 5 => 'notice', 6 => 'informational', 7 => 'debug'
        }
        
        event.set('syslog_facility', facility)
        event.set('syslog_facility_name', facility_names[facility] || 'unknown')
        event.set('syslog_severity', severity)
        event.set('syslog_severity_name', severity_names[severity] || 'unknown')
      "
    }
  }

  # Parse timestamp
  if [syslog_timestamp] {
    date {
      match => [ 
        "syslog_timestamp", 
        "MMM dd HH:mm:ss", 
        "MMM  d HH:mm:ss",
        "ISO8601"
      ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # Add device IP from host field
  mutate {
    add_field => { "device_ip" => "%{[host]}" }
    add_field => { "log_source" => "syslog" }
    add_field => { "ingestion_timestamp" => "%{@timestamp}" }
  }

  # Use hostname as device_id if available
  if [syslog_hostname] {
    mutate {
      add_field => { "device_id" => "%{syslog_hostname}" }
    }
  } else {
    mutate {
      add_field => { "device_id" => "%{device_ip}" }
    }
  }

  # Detect event types from message patterns
  
  # Link state changes (Interface UP/DOWN)
  if [syslog_message] =~ /[Ll]ink.*[Uu]p|[Ii]nterface.*[Uu]p/ {
    mutate {
      add_field => { "event_type" => "INTERFACE_UP" }
      add_tag => [ "interface", "connectivity" ]
    }
  } else if [syslog_message] =~ /[Ll]ink.*[Dd]own|[Ii]nterface.*[Dd]own/ {
    mutate {
      add_field => { "event_type" => "INTERFACE_DOWN" }
      add_tag => [ "interface", "connectivity", "alert" ]
    }
  }
  
  # Extract interface name from message (for flapping detection)
  if "interface" in [tags] {
    grok {
      match => {
        "syslog_message" => [
          "[Ii]nterface\s+(?<interface>[^\s,]+)",
          "(?<interface>GigabitEthernet[\d/]+)",
          "(?<interface>FastEthernet[\d/]+)",
          "(?<interface>TenGigE[\d/]+)",
          "(?<interface>eth[\d]+)"
        ]
      }
      tag_on_failure => []
    }
  }

  # BGP events
  if [syslog_message] =~ /BGP|bgp/ {
    mutate {
      add_field => { "event_type" => "BGP_EVENT" }
      add_tag => [ "bgp", "routing" ]
    }
    
    if [syslog_message] =~ /[Ee]stablished/ {
      mutate {
        add_field => { "bgp_state" => "established" }
      }
    } else if [syslog_message] =~ /[Ii]dle|[Dd]own/ {
      mutate {
        add_field => { "bgp_state" => "down" }
        add_tag => [ "alert" ]
      }
    }
  }

  # OSPF events
  if [syslog_message] =~ /OSPF|ospf/ {
    mutate {
      add_field => { "event_type" => "OSPF_EVENT" }
      add_tag => [ "ospf", "routing" ]
    }
  }

  # VLAN events
  if [syslog_message] =~ /VLAN|vlan/ {
    mutate {
      add_field => { "event_type" => "VLAN_EVENT" }
      add_tag => [ "vlan", "switching" ]
    }
  }

  # Authentication events
  if [syslog_message] =~ /[Ll]ogin|[Aa]uth|[Ff]ailed|[Ss]uccess/ {
    mutate {
      add_field => { "event_type" => "AUTH_EVENT" }
      add_tag => [ "authentication", "security" ]
    }
  }

  # CPU/Memory alerts
  if [syslog_message] =~ /CPU|cpu|[Mm]emory/ {
    mutate {
      add_field => { "event_type" => "RESOURCE_ALERT" }
      add_tag => [ "performance", "resource" ]
    }
  }

  # Power/Environmental alerts
  if [syslog_message] =~ /[Pp]ower|[Tt]emperature|[Ff]an|PSU/ {
    mutate {
      add_field => { "event_type" => "ENVIRONMENTAL_ALERT" }
      add_tag => [ "hardware", "environmental" ]
    }
  }

  # Map severity to standard levels
  if [syslog_severity_name] {
    if [syslog_severity_name] in ["emergency", "alert", "critical"] {
      mutate {
        add_field => { "severity" => "CRITICAL" }
      }
    } else if [syslog_severity_name] == "error" {
      mutate {
        add_field => { "severity" => "ERROR" }
      }
    } else if [syslog_severity_name] == "warning" {
      mutate {
        add_field => { "severity" => "WARNING" }
      }
    } else {
      mutate {
        add_field => { "severity" => "INFO" }
      }
    }
  }

  # === Device Inventory Enrichment ===
  # Look up device details from database using management IP
  if [syslog_hostname] {
    jdbc_streaming {
      jdbc_driver_library => "/usr/share/logstash/vendor/jar/jdbc/postgresql.jar"
      jdbc_driver_class => "org.postgresql.Driver"
      jdbc_connection_string => "jdbc:postgresql://postgres:5432/smart_noc"
      jdbc_user => "noc_admin"
      jdbc_password => "noc_password"
      statement => "SELECT vendor, device_family, model, os_version, cli_syntax, device_role FROM devices WHERE device_id = ? OR management_ip::text = ?"
      parameters => { "device_id" => "%{syslog_hostname}" }
      target => "device_info"
      tag_on_failure => ["_device_lookup_failed"]
      cache_expiration => 300
      cache_size => 1000
    }
    
    # If device found, add fields at top level
    if [device_info] and [device_info][0] {
      mutate {
        add_field => {
          "device_vendor" => "%{[device_info][0][vendor]}"
          "device_family" => "%{[device_info][0][device_family]}"
          "device_model" => "%{[device_info][0][model]}"
          "device_os_version" => "%{[device_info][0][os_version]}"
          "device_cli_syntax" => "%{[device_info][0][cli_syntax]}"
          "device_role" => "%{[device_info][0][device_role]}"
        }
      }
    }
  }

  # Clean up
  mutate {
    remove_field => [ "type", "@version", "device_info" ]
    # Copy parsed message to main message field
    copy => { "syslog_message" => "message" }
  }
}

output {
  # Publish to Kafka network-logs topic
  # This connects to the existing Smart NOC pipeline
  kafka {
    bootstrap_servers => "kafka:19092"
    topic_id => "network-logs"
    codec => json
    compression_type => "gzip"
  }

  # Debug output disabled to prevent log flooding
  # Uncomment for debugging if needed
  # stdout {
  #   codec => rubydebug {
  #     metadata => true
  #   }
  # }
}
