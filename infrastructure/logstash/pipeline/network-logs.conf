# ==============================================================================
# Smart NOC - Network Logs Pipeline
# ==============================================================================
# This pipeline:
# 1. Consumes raw logs from Kafka
# 2. Parses and enriches them
# 3. Sends to Elasticsearch

input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["network-logs"]
    group_id => "logstash-consumer"
    codec => json
    consumer_threads => 2
    decorate_events => true
  }
}

filter {
  # Add ingestion timestamp
  mutate {
    add_field => { "[@metadata][received_at]" => "%{@timestamp}" }
  }

  # Parse timestamp from log
  if [timestamp] {
    date {
      match => [ "timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
      target => "@timestamp"
    }
  }

  # Extract severity level from message if not present
  if ![severity] and [message] =~ /-%{INT:priority}-/ {
    grok {
      match => { "message" => "-%{INT:priority}-" }
    }
    
    # Map priority to severity
    if [priority] {
      ruby {
        code => "
          priority = event.get('priority').to_i
          severity = case priority
            when 0..2 then 'CRITICAL'
            when 3 then 'ERROR'
            when 4 then 'WARNING'
            else 'INFO'
          end
          event.set('severity', severity)
        "
      }
    }
  }

  # Parse common network log patterns
  grok {
    match => {
      "message" => [
        "%{SYSLOG5424PRI}?%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} ?%{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}",
        "%{SYSLOG5424PRI}?%{TIMESTAMP_ISO8601:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} ?%{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      ]
    }
  }

  # Parse interface events
  if [message] =~ /LINK.*UPDOWN/ {
    grok {
      match => {
        "message" => "Interface %{NOTSPACE:interface}.*changed state to %{WORD:link_state}"
      }
    }
  }

  # Parse BGP events
  if [message] =~ /BGP/ {
    grok {
      match => {
        "message" => "neighbor %{IP:bgp_neighbor} %{WORD:bgp_state}"
      }
    }
  }

  # Parse CPU alerts  
  if [message] =~ /CPU/ {
    grok {
      match => {
        "message" => "CPU utilization is %{NUMBER:cpu_utilization}%"
      }
    }
  }

  # Parse authentication failures
  if [message] =~ /LOGIN_FAILED/ {
    grok {
      match => {
        "message" => "user %{USERNAME:failed_username} from %{IP:source_ip}"
      }
    }
  }

  # Add tags based on event type
  if [event_type] == "INTERFACE_DOWN" or [event_type] == "INTERFACE_UP" {
    mutate {
      add_tag => ["interface", "connectivity"]
    }
  }

  if [event_type] =~ /BGP/ {
    mutate {
      add_tag => ["bgp", "routing"]
    }
  }

  if [event_type] == "HIGH_CPU" {
    mutate {
      add_tag => ["performance", "resource"]
    }
  }

  if [event_type] == "AUTH_FAILURE" {
    mutate {
      add_tag => ["security", "authentication"]
    }
  }

  # Add device location metadata (would come from CMDB in production)
  if [device_id] =~ /^core-router/ {
    mutate {
      add_field => { "device_role" => "core" }
      add_field => { "criticality" => "high" }
    }
  } else if [device_id] =~ /^dist-switch/ {
    mutate {
      add_field => { "device_role" => "distribution" }
      add_field => { "criticality" => "medium" }
    }
  } else if [device_id] =~ /^edge-firewall/ {
    mutate {
      add_field => { "device_role" => "edge" }
      add_field => { "criticality" => "high" }
    }
  }

  # Calculate event hash for deduplication
  fingerprint {
    source => ["device_id", "event_type", "interface", "message"]
    target => "event_fingerprint"
    method => "SHA256"
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["@version", "priority"]
  }
}

output {
  # Send to Elasticsearch (for storage, search, dashboards)
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "network-logs-%{+YYYY.MM.dd}"
    document_id => "%{event_fingerprint}"
  }

  # Send enriched logs to Kafka for downstream services
  # This creates a proper pipeline: Raw Logs → Logstash → Enriched Logs → Anomaly Detector
  kafka {
    bootstrap_servers => "kafka:19092"
    topic_id => "network-logs-enriched"
    codec => json
    compression_type => "gzip"
  }

  # Debug output (can be disabled in production)
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }

  # Dead letter queue - disabled for POC
  # if "_grokparsefailure" in [tags] {
  #   kafka {
  #     bootstrap_servers => "kafka:19092"
  #     topic_id => "network-logs-dead-letter"
  #     codec => json
  #   }
  # }
}
