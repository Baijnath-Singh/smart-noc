input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["anomalies"]
    group_id => "logstash-anomalies-consumer"
    codec => json
    auto_offset_reset => "earliest"
    consumer_threads => 1
    decorate_events => true
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  
  # Add anomaly processing metadata
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "anomalies"
      "pipeline" => "anomalies-ingestion"
    }
  }
  
  # Ensure numeric fields are properly typed
  mutate {
    convert => {
      "confidence" => "float"
      "event_count" => "integer"
    }
  }
  
  # Add enrichment for anomaly severity if not present
  if ![severity] {
    mutate {
      add_field => { "severity" => "MEDIUM" }
    }
  }
  
  # Create fingerprint for deduplication
  fingerprint {
    source => ["anomaly_type", "device_id", "timestamp"]
    target => "[@metadata][fingerprint]"
    method => "SHA256"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "anomalies-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"
  }
  
  # Debug output for monitoring
  stdout {
    codec => dots
  }
}
