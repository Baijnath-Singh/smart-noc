  - id: EXT-040
    title: "EXOS Port Security and MAC Lockdown Configuration"
    event_type: SECURITY_VIOLATION
    vendor: extreme
    platform: exos
    success_rate: 0.90
    category: troubleshooting
    content: |
      Port security violations, MAC address lockdown, and secure MAC binding issues.
      
      Common Causes:
      - MAC limit exceeded (40%)
      - Unauthorized device connected (30%)
      - MAC aging causing re-learn (15%)
      - Violation action too strict (10%)
      - Static MAC misconfigured (5%)
      
      EXOS Port Security Commands:
      # show port-security
      # show port-security port <port>
      # show mac-security
      
      Enable port security:
      # enable port-security
      
      Limit MAC addresses per port:
      # configure port-security port <port> max-mac-count <1-600>
      
      Configure violation action:
      # configure port-security port <port> violation-action <restrict|shutdown>
      - restrict: Drop traffic from unauthorized MACs
      - shutdown: Disable port on violation
      
      Lock MAC address to port:
      # configure mac-security port <port> mac <mac-address> lock
      
      Sticky MAC learning:
      # configure port-security port <port> sticky-mac enable
      → Learned MACs become permanent
      
      Clear violations:
      # clear port-security violation port <port>
      # enable port <port>  (if shutdown)
      
      Prevention:
      - Use appropriate MAC limits
      - Configure guest VLANs
      - Monitor security violations
      - Document authorized MAC addresses
      - Regular security audit
