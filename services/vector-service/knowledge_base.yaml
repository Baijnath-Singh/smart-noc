    event_type: ROUTING_FAILURE
    vendor: extreme
    platform: exos
    success_rate: 0.89
    category: troubleshooting
    content: |
      Route selection issues due to administrative distance and protocol priority.
      
      Administrative Distance Values (EXOS):
      - Connected: 0
      - Static: 1
      - OSPF: 110
      - BGP: 170
      - Unknown: 255
      
      Common Issues:
      - Static route preferred over dynamic (30%)
      - Wrong protocol chosen (25%)
      - Floating static not activating (20%)
      - Route flapping (15%)
      - Preference misconfigured (10%)
      
      Configure route preference:
      # configure iproute add <dest> <mask> <nexthop> <distance>
      
      Example - Backup route with distance 250:
      # configure iproute add default 10.1.1.253 250

