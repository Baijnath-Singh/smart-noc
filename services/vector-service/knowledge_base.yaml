  # ============================================================================
  # EXTREME NETWORKS - VOSS ISSUES (5 articles)
  # ============================================================================
  - id: EXT-006
    title: "VOSS Port Down - Link Layer Discovery and Troubleshooting"
    event_type: INTERFACE_DOWN
    vendor: extreme
    platform: voss
    success_rate: 0.89
    category: troubleshooting
    content: |
      VOSS (Virtual Services Platform OS) port down troubleshooting.
      VSP series switches use VOSS OS with different command syntax than EXOS.

      Common Causes (Extreme VOSS):
      1. Physical layer issue - cable or transceiver (45%)
      2. Port administratively disabled (20%)
      3. Spanning Tree blocking (15%)
      4. Speed/duplex mismatch (12%)
      5. Error disable feature triggered (8%)

      VOSS Diagnostic Commands:
      1. show interfaces gigabitEthernet <port>
         → Port status, speed, duplex, errors
      
      2. show interfaces gigabitEthernet name "<port_name>"
         → Port info by configured name
      
      3. show interfaces gigabitEthernet state
         → Quick overview of all port states
      
      4. show lldp neighbor
         → Verify connected device via LLDP
      
      5. show spanning-tree rstp port-role
         → Check if port is blocked by RSTP
      
      6. show error-disable
         → Check if port auto-disabled due to errors

      VOSS Remediation Steps:
      1. Enable port if administratively down:
         (config)# interface gigabitEthernet <port>
         (config-if)# no shutdown
         (config-if)# exit
      
      2. Force speed and duplex:
         (config)# interface gigabitEthernet <port>
         (config-if)# speed 1000
         (config-if)# duplex full
         (config-if)# no auto-negotiate
         (config-if)# exit
      
      3. Check and clear error-disable:
         # show error-disable
         (config)# interface gigabitEthernet <port>
         (config-if)# error-disable recovery
         (config-if)# exit
      
      4. Verify cabling:
         → Check cable connection both ends
         → Test with known-good cable
         → Verify transceiver seated properly
      
      5. Check spanning tree:
         # show spanning-tree rstp
         → If blocking: Review topology
         → Adjust port priority if needed
      
      6. Enable port description for documentation:
         (config-if)# name "<description>"

      VOSS-Specific Features:
      - VOSS uses Cisco-like CLI syntax (unlike EXOS)
      - Port format: gigabitEthernet <slot/port>
      - Use "show tech" for comprehensive diagnostic output
      - MLT (Multi-Link Trunking) for link aggregation

      VOSS Port Configuration Examples:
      - Access port: interface GigabitEthernet 1/1 → no shutdown
      - Description: name "Server-Port-Prod"
      - Speed: speed 1000, duplex full
      - Enable: no shutdown

      Prevention:
      - Use "name" command to label ports clearly
      - Enable LLDP: "lldp run" globally
      - Regular cable testing and documentation
      - Monitor port status via SNMP
      - Use MLT for critical uplinks (redundancy)

  - id: EXT-007
    title: "VOSS OSPF Neighbor Down - Routing Protocol Troubleshooting"
    event_type: BGP_INSTABILITY
    vendor: extreme
    platform: voss
    success_rate: 0.88
    category: troubleshooting
    content: |
      VOSS OSPF neighbor adjacency failures preventing route learning.
      Common in VSP routing configurations.

      Common Causes (Extreme VOSS):
      1. Interface down or unreachable (30%)
      2. Area mismatch (25%)
      3. Authentication mismatch (20%)
      4. Network type mismatch (15%)
      5. Hello/dead timer mismatch (10%)

      VOSS Diagnostic Commands:
      1. show ip ospf neighbor
         → Display OSPF neighbor states and timers
      
      2. show ip ospf interface
         → OSPF-enabled interfaces and their parameters
      
      3. show ip ospf
         → General OSPF process information
      
      4. show ip ospf area
         → Area configuration details
      
      5. show ip route ospf
         → Routes learned via OSPF
      
      6. show log tail 50 | include OSPF
         → Recent OSPF-related log messages

      VOSS Remediation Steps:
      1. Verify interface status:
         # show interfaces gigabitEthernet <port>
         → Must be "up" for OSPF adjacency
      
      2. Check OSPF configuration:
         # show running-config | include router ospf
         → Verify process ID and networks
      
      3. Verify area consistency:
         (config)# router ospf
         (config-ospf)# show ip ospf interface
         → Both neighbors must be in same area
      
      4. Check authentication:
         (config)# interface gigabitEthernet <port>
         (config-if)# ip ospf authentication-key <key>
         → Must match on both sides
      
      5. Verify network type:
         (config-if)# show ip ospf interface
         → Point-to-point, broadcast, etc. must match
      
      6. Check hello/dead timers:
         # show ip ospf interface | include Hello
         (config-if)# ip ospf hello-interval 10
         (config-if)# ip ospf dead-interval 40
         → Must match between neighbors
      
      7. Enable OSPF debugging (temporary):
         # debug ip ospf adj
         → Monitor adjacency formation
         # no debug all (when done)

      VOSS OSPF Configuration Examples:
      - Enable OSPF:
        (config)# router ospf
        (config-ospf)# router-id 1.1.1.1
        (config-ospf)# enable
      
      - Add interface to area:
        (config)# interface gigabitEthernet 1/1
        (config-if)# ip address 10.1.1.1/24
        (config-if)# ip ospf enable
        (config-if)# ip ospf area 0.0.0.0
      
      - Authentication (MD5):
        (config-if)# ip ospf message-digest-key 1 md5 <password>
        (config-if)# ip ospf authentication message-digest

      VOSS-Specific OSPF Features:
      - Supports OSPF v2 (IPv4) and v3 (IPv6)
      - Default hello: 10s, dead: 40s
      - Use "show ip ospf database" for LSA inspection
      - VSP supports multi-area OSPF and route redistribution

      Prevention:
      - Document OSPF design: Areas, router IDs, authentication
      - Use consistent timers across all OSPF routers
      - Enable authentication for security
      - Monitor OSPF neighbor states via SNMP
      - Regular configuration backups: "save config"

  - id: EXT-008
    title: "VOSS Spanning Tree Loop Detection and Prevention"
    event_type: NETWORK_PERFORMANCE
    vendor: extreme
    platform: voss
    success_rate: 0.86
    category: troubleshooting
    content: |
      VOSS Spanning Tree Protocol (STP) loop detection and mitigation.
      Loops cause broadcast storms, high CPU, and network outages.

      Common Causes (Extreme VOSS):
      1. STP disabled on one or more switches (40%)
      2. Incorrect BPDU handling (25%)
      3. One-way link failure (15%)
      4. Mismatched STP modes (RSTP vs STP) (12%)
      5. Port misconfiguration (edge vs non-edge) (8%)

      VOSS Diagnostic Commands:
      1. show spanning-tree rstp
         → Global RSTP status and root bridge
      
      2. show spanning-tree rstp port-role
         → Port roles: Root, Designated, Alternate
      
      3. show spanning-tree rstp port-config
         → Per-port STP configuration
      
      4. show interfaces gigabitEthernet statistics
         → Look for excessive broadcasts
      
      5. show cpu
         → High CPU may indicate broadcast storm
      
      6. show mac-address-table count
         → Flapping MAC addresses indicate loop

      VOSS Remediation Steps:
      1. Verify RSTP is enabled globally:
         # show spanning-tree rstp
         (config)# spanning-tree rstp enable
      
      2. Identify loop location:
         # show interfaces gigabitEthernet statistics | include Broadcast
         → Port with abnormally high broadcast count
      
      3. Emergency: Shutdown suspect port:
         (config)# interface gigabitEthernet <port>
         (config-if)# shutdown
      
      4. Enable BPDU guard on access ports:
         (config-if)# spanning-tree rstp edge-port true
         (config-if)# spanning-tree rstp bpdu-guard enable
      
      5. Configure root bridge properly:
         (config)# spanning-tree rstp priority 0
         → Lower priority = preferred root
      
      6. Enable port-fast on access ports:
         (config-if)# spanning-tree rstp edge-port true
         → Faster convergence, skip listening/learning
      
      7. Verify consistent STP mode:
         # show spanning-tree rstp
         → All switches should run RSTP (802.1w)

      VOSS STP Best Practices:
      - Use RSTP (Rapid Spanning Tree) for faster convergence
      - Configure root bridge explicitly (don't rely on defaults)
      - Enable BPDU guard on all access ports
      - Use edge-port for hosts, disable for switches
      - Monitor root bridge changes (SNMP traps)

      VOSS STP Configuration Examples:
      - Enable RSTP globally:
        (config)# spanning-tree rstp enable
      
      - Set root bridge:
        (config)# spanning-tree rstp priority 4096
      
      - Access port configuration:
        (config)# interface gigabitEthernet 1/1-24
        (config-if)# spanning-tree rstp edge-port true
        (config-if)# spanning-tree rstp bpdu-guard enable
      
      - Uplink port:
        (config)# interface gigabitEthernet 1/25-26
        (config-if)# spanning-tree rstp edge-port false

      Prevention:
      - Always enable RSTP on all switches
      - Document STP topology and root bridge
      - Use consistent STP mode across network
      - Enable BPDU guard on access ports
      - Monitor topology changes via syslog/SNMP
      - Regular STP configuration audits

  - id: EXT-009
    title: "VOSS LAG (Link Aggregation) Configuration and Troubleshooting"
    event_type: CONNECTIVITY_ISSUE
    vendor: extreme
    platform: voss
    success_rate: 0.90
    category: troubleshooting
    content: |
      VOSS MLT (Multi-Link Trunking) / LAG configuration issues.
      VSP series uses MLT for link aggregation (similar to LAG/Port-Channel).

      Common Causes (Extreme VOSS):
      1. Member port configuration mismatch (35%)
      2. LACP mode mismatch (active vs passive) (25%)
      3. One or more member ports down (20%)
      4. VLAN configuration inconsistent (15%)
      5. Physical cabling issues (5%)

      VOSS Diagnostic Commands:
      1. show mlt
         → Display all MLT trunks and member ports
      
      2. show mlt <mlt_id>
         → Detailed MLT information
      
      3. show lacp
         → LACP protocol status
      
      4. show interfaces gigabitEthernet mlt-port
         → Ports assigned to MLTs
      
      5. show vlan mlt
         → VLAN assignment on MLT

      VOSS Remediation Steps:
      1. Create MLT trunk:
         (config)# mlt <mlt_id>
         (config-mlt)# enable
         (config-mlt)# exit
      
      2. Add member ports:
         (config)# interface gigabitEthernet <port_range>
         (config-if)# mlt <mlt_id>
         (config-if)# lacp enable
         (config-if)# exit
      
      3. Verify all member ports are up:
         # show interfaces gigabitEthernet state
         → All MLT members must be "up"
      
      4. Check LACP status:
         # show lacp
         → Verify active aggregation
      
      5. Ensure consistent port configuration:
         → All MLT members must have same:
           - Speed and duplex
           - VLAN configuration
           - STP settings
      
      6. Configure VLAN on MLT:
         (config)# vlan members add <vlan_id> <mlt_id>
      
      7. Verify load distribution:
         # show mlt <mlt_id> statistics
         → Check traffic distribution across members

      VOSS MLT Configuration Examples:
      - Create MLT with two ports:
        (config)# mlt 1
        (config-mlt)# name "Uplink-To-Core"
        (config-mlt)# enable
        (config-mlt)# exit
        
        (config)# interface gigabitEthernet 1/25-1/26
        (config-if)# mlt 1
        (config-if)# lacp key 1
        (config-if)# lacp enable
        (config-if)# exit
      
      - Add VLANs to MLT:
        (config)# vlan members add 10,20,30 mlt 1

      VOSS-Specific MLT Features:
      - MLT = Multi-Link Trunking (VSP terminology)
      - Supports up to 8 ports per MLT
      - LACP (802.3ad) for dynamic aggregation
      - Load balancing: src-dst-mac, src-dst-ip
      - MLT IDs: 1-512 range

      VOSS Load Balancing:
      - Default: src-dst-mac hashing
      - Configure: (config)# mlt load-balance <algorithm>
      - Options: src-dst-mac, src-dst-ip, src-dst-port

      Prevention:
      - Use consistent port speeds across MLT members
      - Enable LACP for dynamic failure detection
      - Document MLT IDs and purpose
      - Monitor MLT status via SNMP
      - Use VLANs on MLT instead of individual ports
      - Regular cable testing on MLT members

  - id: EXT-010
    title: "VOSS Software Version Mismatch and Upgrade Issues"
    event_type: DEVICE_FAILURE
    vendor: extreme
    platform: voss
    success_rate: 0.85
    category: troubleshooting
    content: |
      VOSS software version issues, upgrade problems, and compatibility.
      VSP series software management and troubleshooting.

      Common Causes (Extreme VOSS):
      1. Incompatible software version with hardware (30%)
      2. Insufficient flash space for new image (25%)
      3. Corrupted software image (20%)
      4. Failed upgrade procedure (15%)
      5. License incompatibility (10%)

      VOSS Diagnostic Commands:
      1. show software
         → Display current and installed software versions
      
      2. show boot config
         → Boot configuration and image selection
      
      3. show sys-info
         → System information including software version
      
      4. dir
         → List files in flash storage
      
      5. show license
         → Display installed licenses
      
      6. show log tail 100
         → Recent system messages

      VOSS Software Management Steps:
      1. Check current version:
         # show software
         → Note primary, secondary, and boot flags
      
      2. Verify available flash space:
         # dir
         → Ensure sufficient space (typically need 150MB+)
      
      3. Download software image (via TFTP/SFTP):
         # software add <protocol>://<server>/<filename>
         Example: software add tftp://10.1.1.100/VOSS9400.tgz
      
      4. Activate new software:
         # software activate <version>
         → Sets boot flag for new version
      
      5. Commit new software (after testing):
         # software commit
         → Makes new version permanent
      
      6. Reboot to new version:
         # reset -y
      
      7. Verify after reboot:
         # show software
         # show sys-info

      VOSS Software Upgrade Best Practices:
      - Always backup configuration:
        # copy config tftp://<server>/<filename>
      
      - Check release notes for known issues
      - Verify hardware compatibility matrix
      - Test in lab/dev environment first
      - Schedule maintenance window
      - Have console access during upgrade
      - Keep old version as rollback option

      VOSS Rollback Procedure:
      1. If new version has issues:
         # software activate <old_version>
         # reset -y
      
      2. If system won't boot:
         → Use bootloader recovery mode
         → Press Ctrl-Y during boot
         → Boot to alternate image

      VOSS License Management:
      - Check required licenses:
        # show license
      
      - Install license file:
        # license install <tftp/usb>://<filename>
      
      - Some features require additional licenses:
        → Advanced routing (OSPF, BGP)
        → Fabric Attach
        → Premier or Advanced license tier

      Common VOSS Version Issues:
      - VOSS 9.x: Latest, recommended for new deployments
      - VOSS 8.x: Mature, stable for existing networks
      - Check "End of Support" dates on Extreme website
      - VSP 4000/7000/8000 have different image files
      - XA1400 uses separate VOSS image

      Prevention:
      - Maintain consistent software versions across network
      - Document software versions in CMDB
      - Subscribe to Extreme security advisories
      - Regular maintenance windows for updates
      - Keep one version back as rollback image
      - Test configuration backup/restore procedures
      - Monitor flash space usage via SNMP

